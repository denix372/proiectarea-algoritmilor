name: Deploy to GitHub Pages

on:
  push:
    branches:
      - main
    # Review gh actions docs if you want to further scope it to the `docs` directory!

jobs:
  build:
    name: Build and Deploy Docusaurus
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          # If your docusaurus is in a subfolder like `website`, point to it:
          cache-dependency-path: 'website/package-lock.json'
          
      - name: Install dependencies
        run: npm ci
        working-directory: ./website
        
      - name: Build website
        run: npm run build
        working-directory: ./website
        
      - name: Deploy to GitHub Pages
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./website/build  # Use ./website/build if nested
          user_name: 'github-actions[bot]'
          user_email: 'github-actions[bot]@users.noreply.github.com'